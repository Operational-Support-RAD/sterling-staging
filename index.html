:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

input[type="checkbox"]{-webkit-appearance:none;appearance:none;width:18px;height:18px;padding:0;margin:0;flex:none;border:1.5px solid var(--muted);border-radius:50%;background:transparent;display:inline-grid;place-content:center;cursor:pointer;vertical-align:middle;transition:background .12s,border-color .12s}

input[type="checkbox"]:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

a{color:var(--ink)}

<script>
(function(){
'use strict';

/* ---------- helpers ---------- */
const $ = (s, el) => (el || document).querySelector(s);
const $$ = (s, el) => Array.from((el || document).querySelectorAll(s));
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-3);
const pad = n => String(n).padStart(2, '0');
const iso = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const parseISO = s => { const p = s.split('-').map(Number); return new Date(p[0], p[1] - 1, p[2]); };
const addDays = (s, n) => { const d = parseISO(s); d.setDate(d.getDate() + n); return iso(d); };
const dayDiff = (a, b) => Math.round((parseISO(a) - parseISO(b)) / 86400000);
const TODAY = iso(new Date());
const fmtDay = s => parseISO(s).toLocaleDateString('en-GB', {weekday: 'short', day: 'numeric', month: 'short'});
const fmtH = n => (Math.round((+n || 0) * 100) / 100) + ' h';
const sum = (arr, f) => arr.reduce((a, x) => a + (f(x) || 0), 0);
const isURL = s => /^https?:\/\/\S+$/i.test(s || '');
const quarterOf = s => Math.floor((parseISO(s).getMonth()) / 3) + 1;

/* ---------- state ---------- */
const KEY = 'sterling-proto-v6';
let ORD = 0;
let S;
const ui = {sel: []};
let saveT = null;
const REQ_FIELDS = ['title', 'date', 'deadline', 'deadlineTime', 'time', 'est', 'priority', 'desc', 'krId', 'catId', 'link'];
function syncReq(){
  S.tasks.forEach(function(t){
    if (!t.grp) return;
    t.grp.forEach(function(id){
      const r = S.tasks.find(x => x.id === id); if (!r || !r.asg || r.asg.state !== 'wait') return;
      REQ_FIELDS.forEach(f => { r[f] = t[f]; }); r.tags = (t.tags || []).slice(); r.subs = (t.subs || []).map(x => ({id: x.id, title: x.title, done: false}));
    });
  });
}
const SV = {t: null};
const SV_TXT = {saved: 'Saved', saving: 'Saving…', error: 'Not saved. Click to retry'};
function setSave(st){
  const el = document.getElementById('envpill'); if (!el) return; el.dataset.s = st;
  const t = el.querySelector('.svt'); if (t) t.textContent = SV_TXT[st];
  el.setAttribute('aria-label', SV_TXT[st] + '. Build ' + BUILD + '. ' + (st === 'error' ? 'Click to retry' : 'What is new in this build'));
}
function save(){
  try { syncReq(); } catch(e) {}
  setSave('saving');
  if (CLOUD) return cloudSave();
  clearTimeout(saveT);
  saveT = setTimeout(function(){
    let ok = true;
    try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e) { ok = false; }
    clearTimeout(SV.t); SV.t = setTimeout(function(){ setSave(ok ? 'saved' : 'error'); }, 450);
  }, 150);
}
function load(){
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) {
      const o = JSON.parse(raw);
      if (o && o.v === 6) {
        if (!o.dp1) {
          const order = {Meetings: 0, NQM: 1, Reports: 2};
          (o.users || []).forEach(function(u){ if (u.view && u.view.every(b => order[b.name] != null)) u.view.sort((a, b) => order[a.name] - order[b.name]); });
          Object.keys(o.plans || {}).forEach(function(k){ if (k.split('|')[1] >= TODAY) delete o.plans[k]; });
          o.dp1 = 1;
        }
        if (!o.st2) {
          const fix = x => { if (x && x.status === 'At risk') x.status = 'Continuing'; };
          (o.goals || []).forEach(fix); (o.krs || []).forEach(function(k){ fix(k); (k.hist || []).forEach(fix); }); (o.tasks || []).forEach(fix);
          (o.changes || []).forEach(function(c){ if (c.old === 'At risk') c.old = 'Continuing'; if (c.new === 'At risk') c.new = 'Continuing'; });
          o.st2 = 1;
        }
        if (!o.kd1) {
          const now = Date.now();
          (o.tasks || []).forEach(function(t){ if (t.done && t.krId && !t.deleted) t.deleted = now; });
          o.kd1 = 1;
        }
        o.lists = o.lists || [];
        return o;
      }
    }
  } catch(e) {}
  return seed();
}

function newTask(o){
  return Object.assign({
    id: uid(), title: '', catId: null, owner: null, date: null, est: null, status: 'Not started',
    done: false, doneAt: null, scope: 'team', fromLead: false, priority: null, tags: [], desc: '', subs: [],
    createdBy: null, createdAt: TODAY, krId: null, link: '', note: '', deadline: null, order: ++ORD,
    hist: [], deleted: null, claimedBy: null
  }, o);
}

function seed(){
  const T = TODAY;
  const YEAR = parseISO(T).getFullYear();
  const users = [
    {id:'u1', name:'Maya', role:'Team lead'},
    {id:'u2', name:'Dan', role:'Middle'},
    {id:'u3', name:'Iris', role:'Junior'},
    {id:'u4', name:'Leo', role:'Junior'},
    {id:'u5', name:'Nora', role:'Junior'}
  ];
  users.forEach(u => { u.pto = u.role === 'Team lead' ? 25 : 20; });
  const categories = [
    {id:'c1', name:'Reports', goalLink:false, est:null, archived:false},
    {id:'c2', name:'NQM', goalLink:false, est:null, archived:false},
    {id:'c3', name:'Meetings', goalLink:false, est:null, archived:false}
  ];
  users.forEach(u => { u.view = [categories[2], categories[1], categories[0]].map(c => ({id: c.id, name: c.name})); });
  const goals = [
    {id:'g1', year:YEAR, title:'Automate recurring reports', archived:false, deleted:null},
    {id:'g2', year:YEAR, title:'Faster client onboarding', archived:false, deleted:null},
    {id:'g3', year:YEAR, title:'Reporting accuracy', archived:false, deleted:null},
    {id:'g4', year:YEAR, title:'Team skills', archived:false, deleted:null}
  ];
  goals.forEach(g => { g.notes = ''; g.links = []; });
  ['In progress', 'In progress', 'Continuing', 'Not started'].forEach((st, i) => { goals[i].status = st; });
  goals[0].notes = 'Owner: Maya. Reports are listed in the shared tracker.';
  goals[0].links = [{id: 'gl1', label: 'Report tracker', url: 'https://example.com/tracker'}];
  const mk = (id, g, title, q, path, link) => ({
    id: id, goalId: g, title: title, quarter: q, links: link ? [{id: id + 'l', label: 'Board', url: link}] : [], notes: '', deleted: null, subs: [],
    status: path[path.length - 1][0],
    hist: path.map(p => ({status: p[0], at: addDays(T, -p[1]), by: 'u1'}))
  });
  const krs = [
    mk('k1','g1','Move 40 weekly reports to automated runs',2,[['Not started',200],['In progress',150],['Done',70]],'https://example.com/boards/1001'),
    mk('k2','g1','Cut manual steps per report to under 5',3,[['Not started',120],['In progress',60]],'https://example.com/boards/1002'),
    mk('k3','g1','Document every automated report',4,[['Not started',30]],''),
    mk('k4','g2','Onboard a new client in 5 working days',1,[['Not started',280],['In progress',230],['Done',150]],'https://example.com/boards/1003'),
    mk('k5','g2','Standard onboarding checklist in use by everyone',2,[['Not started',200],['In progress',140],['Done',90]],''),
    mk('k6','g2','Short feedback survey after each onboarding',4,[['Not started',60],['In progress',12]],''),
    mk('k7','g3','Reduce report errors by 30%',3,[['Not started',150],['In progress',100],['Continuing',20]],'https://example.com/boards/1004'),
    mk('k8','g3','Peer check on every client report',4,[['Not started',50],['In progress',25]],''),
    mk('k9','g4','Each person gives one internal talk',4,[['Not started',45],['In progress',10]],''),
    mk('k10','g4','Cross-training on two report types per person',3,[['Not started',130],['In progress',80]],'')
  ];
  const activeKrs = krs.filter(k => k.status !== 'Done').map(k => k.id);
  const SUBS = {k2: [['Pick the 10 slowest reports', 1], ['Remove duplicate export steps', 1], ['Recheck run times', 0]], k3: [['List all automated reports', 0], ['Write one page per report', 0], ['Review with the lead', 0]],
    k7: [['Define what counts as an error', 1], ['Log errors for four weeks', 1], ['Compare with last quarter', 0]], k9: [['Pick topics', 1], ['Book talk slots', 0]], k10: [['Choose the two report types', 1], ['Pair people up', 0]]};

  const tasks = [];
  let pc = 0;
  const add = o => tasks.push(newTask(Object.assign({scope: o.catId === 'c4' ? 'personal' : 'team', priority: [2, 2, 1, 3, 2, 3, 2][pc++ % 7]}, o)));
  const OPS = ['Weekly report batch','Client queue replies','Peer check on report set','Report archive upkeep','Data refresh and review','Scheduled run check'];
  const MEET = ['Team sync','One-to-one','Planning call'];
  const CHS = ['Automation script cleanup','Checklist improvements','Training material draft','Process notes update','Survey question draft'];
  const TAGS = ['automation','training','process','survey'];
  const dow = (parseISO(T).getDay() + 6) % 7;
  const mon = addDays(T, -dow);
  const wd = [0,1,2,3,4].map(i => addDays(mon, i));
  const EST_OP = [1, 1.5, 2, 2.5, 3];
  users.forEach(function(u, ux){
    wd.forEach(function(dd, di){
      const past = dd < T;
      const r = i => (((ux * 31 + di * 17 + i * 13 + 7) * 9301) % 233280) / 233280;
      add({title: OPS[(ux + di) % OPS.length], catId:'c1', owner:u.id, date:dd, est: EST_OP[Math.floor(r(1) * 5)],
        done: past && r(2) > 0.15, doneAt: past ? dd : null, createdBy:u.id, createdAt: addDays(dd, -2)});
      if (di % 2 === 0) add({title: MEET[(ux + di) % MEET.length], catId:'c2', owner:u.id, date:dd, est: r(4) > 0.5 ? 1 : 0.5,
        done: past, doneAt: past ? dd : null, createdBy:u.id, createdAt: addDays(dd, -3)});
      if (ux > 0 || di < 3) add({title: CHS[(ux + di * 2) % CHS.length], catId:'c3', owner:u.id, date:dd, est: null, priority: (ux + di) % 4 === 0 ? 1 : 2, tags: [TAGS[(ux + di) % TAGS.length]],
        krId: activeKrs[(ux * 2 + di) % activeKrs.length], done: past && r(6) > 0.25, doneAt: past ? dd : null,
        createdBy:u.id, createdAt: addDays(dd, -4)});
    });
  });
  const NOTES = [
    'Manual steps for the first report set cut from 9 to 6.',
    'Checklist published to the whole team.',
    'First draft reviewed with the lead, two edits left.',
    'Script now runs unattended on one report set.',
    'Error rate on the second set dropped after the peer check.',
    'Survey questions agreed, ready to send.'
  ];
  users.slice(1).forEach(function(u, ux){
    for (let w = 1; w <= 12; w++) {
      const dd = addDays(mon, -7 * w + (ux % 5));
      const k = krs[(w + ux) % krs.length];
      add({title: CHS[(w + ux) % CHS.length], catId:'c3', owner:u.id, date:dd, est: null, tags: [TAGS[(w + ux) % TAGS.length]], krId:k.id,
        done:true, doneAt:dd, note: NOTES[(w + ux) % NOTES.length], createdBy:u.id, createdAt: addDays(dd, -5)});
      add({title: OPS[(w + ux) % OPS.length], catId:'c1', owner:u.id, date:dd, est: [1,2,2.5][(w + ux) % 3], done:true, doneAt:dd, createdBy:u.id, createdAt: addDays(dd, -2)});
    }
  });
  const BL = [['Draft internal how-to for report reruns','automation'],['Try a new export setting on one report','automation'],['Prepare notes for the next client training','training'],['Review the onboarding checklist wording','process']];
  users.forEach(function(u, ux){
    BL.slice(0, 3 + (ux % 2)).forEach(function(b){
      add({title:b[0], catId:'c3', owner:u.id, tags:[b[1]], krId: activeKrs[(ux + 1) % activeKrs.length], priority: ux % 3 === 0 ? 1 : 2, createdBy:u.id, createdAt: addDays(T, -9)});
    });
  });
  const SUBOWN = ['u2', 'u3', 'u4', 'u5']; let sx = 0;
  Object.keys(SUBS).forEach(function(kid){
    SUBS[kid].forEach(function(p){
      sx++;
      const ow = SUBOWN[sx % SUBOWN.length], dd = addDays(T, -(6 + sx * 3));
      add({title: p[0], catId:'c3', owner: ow, krId: kid, scope:'team', createdBy: ow, createdAt: addDays(dd, -3), date: p[1] ? dd : null, done: !!p[1], doneAt: p[1] ? dd : null});
    });
  });
  add({title:'Prepare a five-minute talk outline', catId:'c3', owner:'u2', scope:'team', fromLead:true, createdBy:'u1', krId:'k9', tags:['training'], priority:1, createdAt: addDays(T, -2)});
  add({title:'Check checklist coverage for new reports', catId:'c3', owner:'u3', scope:'team', fromLead:true, createdBy:'u1', krId:'k3', tags:['process'], createdAt: addDays(T, -1)});
  add({title:'Check report archive naming', catId:'c3', owner:null, scope:'team', createdBy:'u1', krId:'k8', tags:['process'], createdAt: addDays(T, -4)});
  add({title:'Test the new export script on one report', catId:'c3', owner:null, scope:'team', createdBy:'u1', krId:'k2', tags:['automation'], createdAt: addDays(T, -1)});
  add({title:'Update the shared FAQ page', catId:'c3', owner:null, scope:'team', createdBy:'u1', krId:'k3', tags:['process'], createdAt: T});

  add({title:'Verify the new report layout', catId:'c1', owner:'u3', scope:'team', fromLead:true, createdBy:'u1', date: wd[3], est:1.5, priority:1});
  add({title:'Weekly client queue review', catId:'c1', owner:'u4', scope:'team', fromLead:true, createdBy:'u1', date: wd[4], est:2});
  add({title:'Onboarding call prep', catId:'c2', owner:'u2', scope:'team', fromLead:true, createdBy:'u1', date: addDays(wd[0], 7), est:1, priority:1});
  tasks.filter(t => t.catId === 'c3' && t.owner === 'u2' && !t.done && t.date).slice(0, 2).forEach(t => { t.subs = [{id: uid(), title: 'Draft', done: true}, {id: uid(), title: 'Review with the lead', done: false}]; t.desc = 'Short working note for this task.'; });
  for (let i = tasks.length - 1; i >= 0; i--) if (tasks[i].catId === 'c2') tasks.splice(i, 1);
  tasks.forEach(function(t, i){
    t.catId = null; t.est = null; t.tags = [];
    if (!t.krId) t.krId = activeKrs[i % activeKrs.length];
    t.status = t.done ? 'Done' : (i % 5 === 0 ? 'In progress' : 'Not started');
  });
  tasks.filter(t => t.owner === 'u2' && !t.done && t.date).slice(0, 1).forEach(t => { t.scope = 'personal'; });
  const setDl = (title, n) => { const t = tasks.find(x => x.title === title && !x.done); if (t) t.deadline = addDays(T, n); };
  setDl('Prepare a five-minute talk outline', 3); setDl('Check checklist coverage for new reports', 1); setDl('Draft internal how-to for report reruns', 6);
  setDl('Update the shared FAQ page', 9); setDl('Onboarding call prep', 8); setDl('Verify the new report layout', 10);
  const plans = {};
  users.forEach(function(u, ux){
    wd.forEach(function(dd, di){
      if (dd < TODAY) plans[u.id + '|' + dd] = {avail: 8, hours: {c1: 3 - (di % 2) * 0.5, c2: 1, c3: 1.5}};
    });
  });
  const days = {};
  const addPto = (uid_, start, n) => { let d = start, c = 0; while (c < n) { if (!isWeekend(d)) { days[uid_ + '|' + d] = {type: 'pto'}; c++; } d = addDays(d, 1); } };
  days['u4|' + wd[4]] = {type: 'reduced', hours: 4};
  addPto('u3', addDays(mon, 7), 2);
  addPto('u2', addDays(T, -75), 3);
  addPto('u5', addDays(T, 40), 5);
  days['u5|' + addDays(mon, 5)] = {type: 'special', hours: 4};
  const forecast = {}; forecast[mon] = 62;
  const changes = [
    {id:uid(), at: Date.now() - 86400000 * 2, by:'u1', kind:'kr', refId:'k7', field:'status', old:'In progress', new:'Continuing', label:'Reduce report errors by 30%'},
    {id:uid(), at: Date.now() - 86400000 * 5, by:'u2', kind:'category', refId:'c3', field:'name', old:'Champion hours', new:'Champion Hours', label:'Category'}
  ];
  const lists = [];
  ['u1', 'u2'].forEach(function(u, n){
    const a = 'l' + (n * 2 + 1), b = 'l' + (n * 2 + 2);
    lists.push({id: a, owner: u, name: 'Reports', secs: [{id: 's' + (n * 2 + 1), name: 'To do soon'}, {id: 's' + (n * 2 + 2), name: 'Later'}]}, {id: b, owner: u, name: 'Team admin', secs: []});
    tasks.filter(t => t.owner === u && !t.date && !t.done).slice(0, 4).forEach(function(t, i){
      t.listId = i < 3 ? a : b; t.secId = i === 0 ? 's' + (n * 2 + 1) : (i === 1 ? 's' + (n * 2 + 2) : null);
    });
  });
  return {
    lists: lists,
    v: 6, me: 'u2', view: 'today', date: T, theme: 'auto', accent: 'gray',
    users: users, categories: categories, settings: {overdueDays: 3, poolDays: 2},
    plans: plans, days: days, forecast: forecast,
    tasks: tasks.filter(t => !(t.done && t.krId)), goals: goals, krs: krs, reflections: [], reviews: {}, changes: changes, st2: 1, kd1: 1
  };
}

/* ---------- selectors ---------- */
const user = id => S.users.find(u => u.id === id);
const me = () => user(S.me);

function tokParse(word){

function parseCSV(text){
  const first = text.split(/\r?\n/)[0] || '';
  const delim = [',', ';', '\t'].map(d => [d, first.split(d).length]).sort((a, b) => b[1] - a[1])[0][0];
  const rows = []; let row = [], cur = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (q) {
      if (ch === '"') { if (text[i + 1] === '"') { cur += '"'; i++; } else q = false; }
      else cur += ch;
    } else if (ch === '"') q = true;
    else if (ch === delim) { row.push(cur); cur = ''; }
    else if (ch === '\n' || ch === '\r') {
      if (ch === '\r' && text[i + 1] === '\n') i++;
      row.push(cur); cur = ''; rows.push(row); row = [];
    } else cur += ch;
  }
  if (cur !== '' || row.length) { row.push(cur); rows.push(row); }
  return rows.map(r => r.map(c => c.trim())).filter(r => r.some(c => c !== ''));
}

function reviewText(year, per){
  const r = PERIODS[per], from = year + '-' + pad(r[0]) + '-01', to = year + '-' + pad(r[1]) + '-31';

  let out = 'Review ' + per + ' ' + year + ', ' + me().name + '\n';
  S.goals.filter(g => g.year === year && !g.deleted).forEach(function(g){
    out += '\n' + g.title + ' [' + (g.status || 'Not started') + ']\n';
    S.krs.filter(k => k.goalId === g.id && !k.deleted).forEach(function(k){
      const ts = liveTasks().filter(t => t.krId === k.id && t.owner === S.me && t.done && t.doneAt >= from && t.doneAt <= to);
      const hist = k.hist.filter(h => h.at <= end), stNow = hist.length ? hist[hist.length - 1].status : 'Not started';
      const rf = S.reflections.filter(x => x.userId === S.me && x.targetType === 'kr' && x.targetId === k.id && x.date >= from && x.date <= to);
      if (!ts.length && !rf.length && stNow === 'Not started') return;
      out += '- ' + k.title + ' [' + qLabel(k.quarter) + ', ' + stNow + ']: ' + ts.length + ' tasks completed\n';
      ts.slice().sort((a, b) => a.doneAt < b.doneAt ? -1 : 1).forEach(t => { out += '    ' + t.doneAt + '  ' + t.title + (t.note ? ' (' + t.note + ')' : '') + '\n'; });
      rf.forEach(x => { out += '    Reflection ' + x.date + ': ' + x.text + '\n'; });
    });
    S.reflections.filter(x => x.userId === S.me && x.targetType === 'goal' && x.targetId === g.id && x.date >= from && x.date <= to)
      .forEach(x => { out += '  Goal reflection ' + x.date + ': ' + x.text + '\n'; });
  });
  const ch = liveTasks().filter(t => t.owner === S.me && t.done && t.doneAt >= from && t.doneAt <= to);
  out += '\nTasks completed in this period: ' + ch.length + '\n';
  return out;
}

const weekStart = () => ui.leadWeek || mondayOf(TODAY);
function weekDays(m){
  const d = [0, 1, 2, 3, 4].map(i => addDays(m, i));
  [5, 6].forEach(function(i){
    const ds = addDays(m, i);
    if (S.settings.fullWeek || S.users.some(u => { const e = dayEntry(u.id, ds); return e && e.type === 'special'; })) d.push(ds);
  });
  return d;
}
function personWeek(uid_, days){
  const avail = sum(days, d => effAvail(uid_, d));
  const per = {}, label = {};
  days.forEach(function(d){
    if (effAvail(uid_, d) <= 0) return;
    const p = getPlan(uid_, d);
    p.blocks.forEach(function(b){ const k = b.name.trim().toLowerCase(); label[k] = label[k] || b.name; per[k] = (per[k] || 0) + (+p.hours[b.id] || 0); });
  });
  const planned = sum(Object.keys(per), k => per[k]);
  const od = overdueTasks(uid_);
  return {avail: avail, per: per, label: label, planned: planned, unest: 0,
    over: od, overFlag: od.filter(t => dayDiff(TODAY, t.date) >= S.settings.overdueDays).length};
}
function blockCols(rows){
  const cols = [], seen = {};
  const add = (k, n) => { if (!seen[k]) { seen[k] = 1; cols.push({id: k, name: n}); } };
  S.users.forEach(u => viewOf(u.id).forEach(b => add(b.name.trim().toLowerCase(), b.name)));
  rows.forEach(r => Object.keys(r.w.per).forEach(k => add(k, r.w.label[k])));
  return cols;
}
function ptoStats(u){
  const y = String(parseISO(TODAY).getFullYear()); let taken = 0, planned = 0;
  Object.keys(S.days).forEach(function(k){
    const p = k.split('|');
    if (p[0] === u.id && S.days[k].type === 'pto' && p[1].slice(0, 4) === y) { if (p[1] < TODAY) taken++; else planned++; }
  });
  const allow = u.pto || 0;
  return {allow: allow, taken: taken, planned: planned, left: allow - taken - planned};
}

    const u = $('#dy-u', f).value, type = $('#dy-t', f).value, from = $('#dy-f', f).value, to = $('#dy-e', f).value || from;
    const h = Math.max(0, +$('#dy-h', f).value || 0);
    if (!from) { fieldErr($('#dy-f', f), 'Pick a start date.'); return; }
    if (to < from) { toast('The end date is before the start date.'); return; }
    let d = from, n = 0;
    while (d <= to && n < 120) {
      if (type === 'special' || !isWeekend(d)) { S.days[pkey(u, d)] = type === 'pto' ? {type: 'pto'} : {type: type, hours: h}; n++; }
      d = addDays(d, 1);
    }
    save(); toast(n ? n + (n === 1 ? ' day' : ' days') + ' added for ' + user(u).name + '.' : 'Those dates are all weekends.'); render();
  },
  assign: function(f){
    const title = $('#as-title', f).value.trim(); if (!title) { fieldErr($('#as-title', f), 'Add a title.'); return; }
    const krv = $('#as-kr', f).value; if (!krv) { fieldErr($('#as-kr', f), 'Choose a key result.'); return; }
    const to = $('#as-to', f).value || null, date = $('#as-date', f).value || null;
    S.tasks.push(newTask({deadline: $('#as-dl', f).value || null, title: title, owner: to, scope: 'team', fromLead: !!to && to !== S.me, createdBy: S.me, date: to ? date : null,
      priority: +$('#as-pri', f).value || null, desc: $('#as-desc', f).value.trim(), krId: krv}));
    save(); closeModal();
    toast(to ? 'Assigned to ' + user(to).name + (date ? ' for ' + fmtDay(date) + '.' : '. It is in their backlog.') : 'Task added.'); render();
  }
});

function restoreOne(type, id, inPlace){
  const item = type === 'Task' ? S.tasks.find(x => x.id === id) : type === 'Goal' ? goal(id) : kr(id);
  if (!item) return false;
  item.deleted = null;
  if (type === 'Task' && !inPlace) {
    item.krId = null; item.needReview = true;
    if (item.done) { item.done = false; item.doneAt = null; item.note = ''; if (item.status === 'Done') item.status = 'Not started'; }
  }
  return true;
}

function trashItems(){
  const out = [];
  S.tasks.filter(t => t.deleted).forEach(t => out.push({type: 'Task', id: t.id, title: t.title, at: t.deleted, own: t.owner === S.me || t.createdBy === S.me}));
  if (isLead()) S.goals.filter(g => g.deleted).forEach(g => out.push({type: 'Goal', id: g.id, title: g.title, at: g.deleted, own: true}));
  if (isLead()) S.krs.filter(k => k.deleted).forEach(k => out.push({type: 'Key result', id: k.id, title: k.title, at: k.deleted, own: true}));
  return out.filter(i => i.own).sort((a, b) => b.at - a.at);
}

function exportData(kind){

      reflections: S.reflections.filter(r => r.userId === S.me), goals: S.goals.filter(g => !g.deleted), keyResults: S.krs.filter(k => !k.deleted)}, null, 2);

const pres = {ch: null, state: {}, gone: {}, seen: {}, timer: null};
const PRES_KEEP = 5 * 60000;
function presList(){
  if (!S || !S.signedIn || !me()) return [];
  const out = [], now = Date.now();
  if (CLOUD) {
    Object.keys(pres.state).forEach(function(id){ if (id === S.me) return; const u = user(id); if (u) out.push({u: u, on: true}); });
    Object.keys(pres.gone).forEach(function(id){ if (pres.state[id]) return; if (now - pres.gone[id] > PRES_KEEP) { delete pres.gone[id]; return; } const u = user(id); if (u) out.push({u: u, on: false}); });
  } else { S.users.filter(u => u.id !== S.me).slice(0, 3).forEach(function(u, i){ out.push({u: u, on: i < 2}); }); }

  const el = document.getElementById('presence'); if (!el) return;
  const L = presList();
  if (!L.length) { el.hidden = true; el.innerHTML = ''; el.dataset.sig = ''; return; }
  const sig = L.map(x => x.u.id + x.u.name + (x.on ? 'a' : 'g')).join(',');
