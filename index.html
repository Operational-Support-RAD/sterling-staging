<style>
/* Layout concept: a quiet ledger. One column of work on the left, the day's hour budget on the right, gray ink on paper, one optional accent. */
:root{
  --bg:#F5F5F5; --surface:#FFFFFF; --ink:#151515; --muted:#5C5C5C; --line:#DADADA; --soft:#EBEBEB;
  --accent:#6E6E6E;
  --warn:#8A5200; --warn-fill:#B26A00; --warn-ink:#FFFFFF; --warn-bg:#F8DFB5;
  --good:#16693F; --good-bg:#C6EBD6;
  --bad:#A8200F; --bad-bg:#F6CCC6;
  --rev:#075C5E; --rev-bg:#C3E7E5;
  --team:#1F49D6; --team-bg:#CFDCFD;
  --p1:#A8200F; --p1bg:#F6CCC6; --p2:#7A4700; --p2bg:#F8DFB5; --p3:#1F49D6; --p3bg:#CFDCFD;
  --scrim:rgba(0,0,0,.45);
  --font-display:'Sora',system-ui,sans-serif;
  --font-body:'Inter',system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121212; --surface:#1B1B1B; --ink:#F2F2F2; --muted:#A8A8A8; --line:#2E2E2E; --soft:#262626;
    --accent:#9A9A9A;
    --warn:#E8A33D; --warn-fill:#E8A33D; --warn-ink:#1B1B1B; --warn-bg:#3A2C14;
    --good:#4CC38A; --good-bg:#16301F;
    --bad:#F07167; --bad-bg:#3B1B18; --rev:#5CC8CA; --rev-bg:#12302F; --team:#8FA8FF; --team-bg:#1E2744;
  --p1:#F07167; --p1bg:#3B1B18; --p2:#E8A33D; --p2bg:#3A2C14; --p3:#8FA8FF; --p3bg:#1E2744;
    --scrim:rgba(0,0,0,.65);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#121212; --surface:#1B1B1B; --ink:#F2F2F2; --muted:#A8A8A8; --line:#2E2E2E; --soft:#262626;
  --accent:#9A9A9A;
  --warn:#E8A33D; --warn-fill:#E8A33D; --warn-ink:#1B1B1B; --warn-bg:#3A2C14;
  --good:#4CC38A; --good-bg:#16301F;
  --bad:#F07167; --bad-bg:#3B1B18; --rev:#5CC8CA; --rev-bg:#12302F; --team:#8FA8FF; --team-bg:#1E2744;
  --p1:#F07167; --p1bg:#3B1B18; --p2:#E8A33D; --p2bg:#3A2C14; --p3:#8FA8FF; --p3bg:#1E2744;
  --scrim:rgba(0,0,0,.65);
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:.875rem;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 64px}
.app{max-width:1180px;margin:0 auto}
button,input,select,textarea{font:inherit}
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;padding-block:8px 6px}
.brand{font-family:var(--font-display);font-weight:600;font-size:1.875rem;line-height:1;letter-spacing:-.02em;white-space:nowrap}
.brand svg{display:inline-block;width:.7em;height:.8em;vertical-align:baseline;margin:0 .015em}
.brand svg path{fill:none;stroke:var(--accent)}
.brand .dot{display:inline-block;width:.12em;height:.12em;margin-left:.07em;background:var(--accent)}
.who{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:.8125rem}
.demo{color:var(--muted);font-size:.7812rem;margin:0 0 4px}
.tabs{display:flex;gap:2px;overflow-x:auto;border-bottom:1px solid var(--line);margin-block:10px 20px}
.tab{background:none;border:0;border-bottom:2px solid transparent;color:var(--muted);padding:10px 14px;cursor:pointer;white-space:nowrap;margin-bottom:-1px}
.tab:hover{color:var(--ink)}
.tab.yel{background:var(--warn-fill);color:var(--warn-ink);font-weight:600;border-radius:8px 8px 0 0;border-bottom-color:var(--warn-fill)}
.tab.yel:hover{color:var(--warn-ink);filter:brightness(1.08)}
.tab.yel[aria-current="page"]{background:var(--warn-fill);color:var(--warn-ink);border-bottom-color:var(--ink)}
.btn.del{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.del:hover{filter:brightness(.92)}
.btn.rev{background:none;border-color:transparent;color:var(--muted);font-weight:400;font-size:.6875rem;letter-spacing:.06em;text-transform:uppercase}
.btn.rev:hover,.btn.rev[aria-expanded=true]{background:none;border-color:transparent;color:var(--ink);text-decoration:none}
.revbox{border-top:1px solid var(--line);margin-top:14px;padding-top:12px}
.revlist{list-style:none;margin:0 0 10px;padding:0;display:grid;gap:10px}
.revlist li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 8px}
.revlist .rd{font-size:.7812rem;color:var(--muted);grid-column:1}
.revlist .rt{white-space:pre-wrap;overflow-wrap:anywhere;grid-column:1}
.revlist .trashbtn{grid-column:2;grid-row:1 / span 2;align-self:start}
.revbox textarea{width:100%;box-sizing:border-box;min-height:64px;font:inherit;font-size:.9375rem}
.revfoot{display:flex;justify-content:space-between;gap:8px;margin-top:14px}
.exnote{display:flex;gap:9px;align-items:flex-start;margin:4px 0 12px;padding:10px 14px;border:1px solid var(--line);background:var(--soft);color:var(--muted);opacity:.62;font-size:.8438rem;line-height:1.5;border-radius:16px}
.exnote>span:last-child{white-space:pre-wrap;overflow-wrap:anywhere;min-width:0}
.exnote .exico{flex:none;margin-top:2px;display:inline-flex;color:var(--muted)}

(function(){

}
function load(){

          Object.keys(o.plans || {}).forEach(function(k){ if (k.split('|')[1] >= TODAY) delete o.plans[k]; });
          o.dp1 = 1;
        }
        if (!o.st2) {
          const fix = x => { if (x && x.status === 'At risk') x.status = 'Continuing'; };
          (o.goals || []).forEach(fix); (o.krs || []).forEach(function(k){ fix(k); (k.hist || []).forEach(fix); }); (o.tasks || []).forEach(fix);
          (o.changes || []).forEach(function(c){ if (c.old === 'At risk') c.old = 'Continuing'; if (c.new === 'At risk') c.new = 'Continuing'; });
          o.st2 = 1;
        }
        if (!o.kd1) {
          const now = Date.now();
          (o.tasks || []).forEach(function(t){ if (t.done && t.krId && !t.deleted) t.deleted = now; });
          o.kd1 = 1;
        }
        o.lists = o.lists || [];

}

function newTask(o){

  }, o);
}

function seed(){

  const users = [

  goals[0].notes = 'Owner: Maya. Reports are listed in the shared tracker.';
  goals[0].links = [{id: 'gl1', label: 'Report tracker', url: 'https://example.com/tracker'}];
  const mk = (id, g, title, q, path, link) => ({
    id: id, goalId: g, title: title, quarter: q, links: link ? [{id: id + 'l', label: 'Board', url: link}] : [], notes: '', deleted: null, subs: [],
    status: path[path.length - 1][0],
    hist: path.map(p => ({status: p[0], at: addDays(T, -p[1]), by: 'u1'}))
  });
  const krs = [
    mk('k1','g1','Move 40 weekly reports to automated runs',2,[['Not started',200],['In progress',150],['Done',70]],'https://example.com/boards/1001'),
    mk('k2','g1','Cut manual steps per report to under 5',3,[['Not started',120],['In progress',60]],'https://example.com/boards/1002'),
    mk('k3','g1','Document every automated report',4,[['Not started',30]],''),
    mk('k4','g2','Onboard a new client in 5 working days',1,[['Not started',280],['In progress',230],['Done',150]],'https://example.com/boards/1003'),
    mk('k5','g2','Standard onboarding checklist in use by everyone',2,[['Not started',200],['In progress',140],['Done',90]],''),
    mk('k6','g2','Short feedback survey after each onboarding',4,[['Not started',60],['In progress',12]],''),
    mk('k7','g3','Reduce report errors by 30%',3,[['Not started',150],['In progress',100],['Continuing',20]],'https://example.com/boards/1004'),
    mk('k8','g3','Peer check on every client report',4,[['Not started',50],['In progress',25]],''),
    mk('k9','g4','Each person gives one internal talk',4,[['Not started',45],['In progress',10]],''),
    mk('k10','g4','Cross-training on two report types per person',3,[['Not started',130],['In progress',80]],'')
  ];
  const activeKrs = krs.filter(k => k.status !== 'Done').map(k => k.id);
  const SUBS = {k2: [['Pick the 10 slowest reports', 1], ['Remove duplicate export steps', 1], ['Recheck run times', 0]], k3: [['List all automated reports', 0], ['Write one page per report', 0], ['Review with the lead', 0]],
    k7: [['Define what counts as an error', 1], ['Log errors for four weeks', 1], ['Compare with last quarter', 0]], k9: [['Pick topics', 1], ['Book talk slots', 0]], k10: [['Choose the two report types', 1], ['Pair people up', 0]]};

  const tasks = [];
  let pc = 0;
  const add = o => tasks.push(newTask(Object.assign({scope: o.catId === 'c4' ? 'personal' : 'team', priority: [2, 2, 1, 3, 2, 3, 2][pc++ % 7]}, o)));
  const OPS = ['Weekly report batch','Client queue replies','Peer check on report set','Report archive upkeep','Data refresh and review','Scheduled run check'];
  const MEET = ['Team sync','One-to-one','Planning call'];
  const CHS = ['Automation script cleanup','Checklist improvements','Training material draft','Process notes update','Survey question draft'];
  const TAGS = ['automation','training','process','survey'];
  const dow = (parseISO(T).getDay() + 6) % 7;
  const mon = addDays(T, -dow);
  const wd = [0,1,2,3,4].map(i => addDays(mon, i));
  const EST_OP = [1, 1.5, 2, 2.5, 3];
  users.forEach(function(u, ux){
    wd.forEach(function(dd, di){
      const past = dd < T;
      const r = i => (((ux * 31 + di * 17 + i * 13 + 7) * 9301) % 233280) / 233280;
      add({title: OPS[(ux + di) % OPS.length], catId:'c1', owner:u.id, date:dd, est: EST_OP[Math.floor(r(1) * 5)],
        done: past && r(2) > 0.15, doneAt: past ? dd : null, createdBy:u.id, createdAt: addDays(dd, -2)});
      if (di % 2 === 0) add({title: MEET[(ux + di) % MEET.length], catId:'c2', owner:u.id, date:dd, est: r(4) > 0.5 ? 1 : 0.5,
        done: past, doneAt: past ? dd : null, createdBy:u.id, createdAt: addDays(dd, -3)});
      if (ux > 0 || di < 3) add({title: CHS[(ux + di * 2) % CHS.length], catId:'c3', owner:u.id, date:dd, est: null, priority: (ux + di) % 4 === 0 ? 1 : 2, tags: [TAGS[(ux + di) % TAGS.length]],
        krId: activeKrs[(ux * 2 + di) % activeKrs.length], done: past && r(6) > 0.25, doneAt: past ? dd : null,
        createdBy:u.id, createdAt: addDays(dd, -4)});

    'Manual steps for the first report set cut from 9 to 6.',
    'Checklist published to the whole team.',
    'First draft reviewed with the lead, two edits left.',
    'Script now runs unattended on one report set.',
    'Error rate on the second set dropped after the peer check.',
    'Survey questions agreed, ready to send.'
  ];
  users.slice(1).forEach(function(u, ux){
    for (let w = 1; w <= 12; w++) {
      const dd = addDays(mon, -7 * w + (ux % 5));
      const k = krs[(w + ux) % krs.length];
      add({title: CHS[(w + ux) % CHS.length], catId:'c3', owner:u.id, date:dd, est: null, tags: [TAGS[(w + ux) % TAGS.length]], krId:k.id,
        done:true, doneAt:dd, note: NOTES[(w + ux) % NOTES.length], createdBy:u.id, createdAt: addDays(dd, -5)});
      add({title: OPS[(w + ux) % OPS.length], catId:'c1', owner:u.id, date:dd, est: [1,2,2.5][(w + ux) % 3], done:true, doneAt:dd, createdBy:u.id, createdAt: addDays(dd, -2)});
    }
  });
  const BL = [['Draft internal how-to for report reruns','automation'],['Try a new export setting on one report','automation'],['Prepare notes for the next client training','training'],['Review the onboarding checklist wording','process']];
  users.forEach(function(u, ux){
    BL.slice(0, 3 + (ux % 2)).forEach(function(b){
      add({title:b[0], catId:'c3', owner:u.id, tags:[b[1]], krId: activeKrs[(ux + 1) % activeKrs.length], priority: ux % 3 === 0 ? 1 : 2, createdBy:u.id, createdAt: addDays(T, -9)});
    });
  });
  const SUBOWN = ['u2', 'u3', 'u4', 'u5']; let sx = 0;
  Object.keys(SUBS).forEach(function(kid){
    SUBS[kid].forEach(function(p){

      const ow = SUBOWN[sx % SUBOWN.length], dd = addDays(T, -(6 + sx * 3));
      add({title: p[0], catId:'c3', owner: ow, krId: kid, scope:'team', createdBy: ow, createdAt: addDays(dd, -3), date: p[1] ? dd : null, done: !!p[1], doneAt: p[1] ? dd : null});
    });
  });
  add({title:'Prepare a five-minute talk outline', catId:'c3', owner:'u2', scope:'team', fromLead:true, createdBy:'u1', krId:'k9', tags:['training'], priority:1, createdAt: addDays(T, -2)});
  add({title:'Check checklist coverage for new reports', catId:'c3', owner:'u3', scope:'team', fromLead:true, createdBy:'u1', krId:'k3', tags:['process'], createdAt: addDays(T, -1)});
  add({title:'Check report archive naming', catId:'c3', owner:null, scope:'team', createdBy:'u1', krId:'k8', tags:['process'], createdAt: addDays(T, -4)});

  for (let i = tasks.length - 1; i >= 0; i--) if (tasks[i].catId === 'c2') tasks.splice(i, 1);
  tasks.forEach(function(t, i){
    t.catId = null; t.est = null; t.tags = [];
    if (!t.krId) t.krId = activeKrs[i % activeKrs.length];
    t.status = t.done ? 'Done' : (i % 5 === 0 ? 'In progress' : 'Not started');
  });
  tasks.filter(t => t.owner === 'u2' && !t.done && t.date).slice(0, 1).forEach(t => { t.scope = 'personal'; });
  const setDl = (title, n) => { const t = tasks.find(x => x.title === title && !x.done); if (t) t.deadline = addDays(T, n); };
  setDl('Prepare a five-minute talk outline', 3); setDl('Check checklist coverage for new reports', 1); setDl('Draft internal how-to for report reruns', 6);
  setDl('Update the shared FAQ page', 9); setDl('Onboarding call prep', 8); setDl('Verify the new report layout', 10);
  const plans = {};

/* ---------- selectors ---------- */
const user = id => S.users.find(u => u.id === id);
const me = () => user(S.me);
const isLead = () => me().role === 'Team lead';
const leadOnly = () => { if (isLead()) return false; toast('Only team leads can change goals and key results.'); return true; };
const GOAL_SHARED = ['id', 'year', 'title', 'archived', 'deleted', 'ord'], KR_SHARED = ['id', 'goalId', 'title', 'quarter', 'deleted', 'ord'];
const cat = id => S.categories.find(c => c.id === id) || (S.otherCats || []).find(c => c.id === id);
const activeCats = () => S.categories.filter(c => !c.archived);
const kr = id => S.krs.find(k => k.id === id);
const goal = id => S.goals.find(g => g.id === id);
const liveTasks = () => S.tasks.filter(t => !t.deleted && !t.req);
const pkey = (u, d) => u + '|' + d;
const dayEntry = (u, d) => S.days[pkey(u, d)] || null;
const isWeekend = d => { const w = parseISO(d).getDay(); return w === 0 || w === 6; };
const leaveCap = (u, d) => { const e = dayEntry(u, d); return e && e.type === 'reduced' ? e.hours : null; };
const viewOf = u => ((user(u) || {}).view || S.categories.filter(c => !c.archived)).map(b => ({id: b.id, name: b.name}));
function getPlan(u, d){
  const k = pkey(u, d);
  if (S.plans[k]) { const p = S.plans[k]; return {avail: p.avail, hours: p.hours, blocks: p.blocks || viewOf(u)}; }
  let best = null, bd = '';
  Object.keys(S.plans).forEach(function(key){
    const parts = key.split('|');
    if (parts[0] === u && parts[1] < d && parts[1] > bd) { bd = parts[1]; best = S.plans[key]; }
  });
  const blocks = viewOf(u), h = {};
  const wk = isWeekend(d);
  blocks.forEach(b => { h[b.id] = 0; });
  return {avail: 8, hours: h, blocks: blocks};

function parseCSV(text){
  const first = text.split(/\r?\n/)[0] || '';
  const delim = [',', ';', '\t'].map(d => [d, first.split(d).length]).sort((a, b) => b[1] - a[1])[0][0];
  const rows = []; let row = [], cur = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (q) {
      if (ch === '"') { if (text[i + 1] === '"') { cur += '"'; i++; } else q = false; }
      else cur += ch;
    } else if (ch === '"') q = true;
    else if (ch === delim) { row.push(cur); cur = ''; }
    else if (ch === '\n' || ch === '\r') {
      if (ch === '\r' && text[i + 1] === '\n') i++;
      row.push(cur); cur = ''; rows.push(row); row = [];
    } else cur += ch;
  }
  if (cur !== '' || row.length) { row.push(cur); rows.push(row); }
  return rows.map(r => r.map(c => c.trim())).filter(r => r.some(c => c !== ''));
}

const TASK_FIELDS = [
  ['title', 'Title', /^(title|task|content|name|summary|what)/i, true],
  ['date', 'Date', /date|due|day|when|deadline/i],
  ['assignee', 'Assign to', /assign|owner|who|person|responsible/i],
  ['priority', 'Priority', /prior|importance/i],
  ['notes', 'Notes', /note|desc|comment|detail/i],
  ['done', 'Done', /done|complete|status/i]
];
const GOAL_FIELDS = [
  ['goal', 'Goal', /goal|objective/i, true],
  ['kr', 'Key result', /key|result|^kr/i, true],
  ['quarter', 'Quarter', /quarter|^q$/i],
  ['status', 'Status', /status/i],
  ['notes', 'Notes', /note|desc|comment/i],
  ['sub', 'Sub-item (becomes a task)', /^sub-?\s?item$|^subtask|^sub-?task/i],
  ['subdone', 'Sub-item done', /sub.*(done|complete)/i],
  ['subdate', 'Sub-item date', /sub.*(date|end|due)/i]
];
function impFields(m){ m = m || ui.imp; return m && m.type === 'goals' ? GOAL_FIELDS : TASK_FIELDS; }
function impGuess(m){
  const used = {}; m.map = {};
  impFields(m).forEach(function(f){
    const i = m.headers.findIndex((h, ix) => !used[ix] && f[2].test(h));
    m.map[f[0]] = i; if (i >= 0) used[i] = 1;
  });
}
function impSetRows(m, rows){
  let h = rows.findIndex(r => r.filter(c => c !== '').length >= 2);
  if (h < 0) h = 0;
  m.headers = (rows[h] || []).map(String);
  m.data = rows.slice(h + 1).filter(r => r.some(c => c !== ''));
  impGuess(m);
}
function sheetRows(wb, name){
  const raw = XLSX.utils.sheet_to_json(wb.Sheets[name], {header: 1, defval: '', raw: true, blankrows: false});
  return raw.map(r => r.map(c => c instanceof Date ? iso(new Date(c.getTime() + 43200000)) : (c == null ? '' : String(c).trim())));

function reviewText(year, per){
  const r = PERIODS[per], from = year + '-' + pad(r[0]) + '-01', to = year + '-' + pad(r[1]) + '-31';
  const end = to < TODAY ? to : TODAY;
  let out = 'Review ' + per + ' ' + year + ', ' + me().name + '\n';
  S.goals.filter(g => g.year === year && !g.deleted).forEach(function(g){
    out += '\n' + g.title + ' [' + (g.status || 'Not started') + ']\n';
    S.krs.filter(k => k.goalId === g.id && !k.deleted).forEach(function(k){
      const ts = liveTasks().filter(t => t.krId === k.id && t.owner === S.me && t.done && t.doneAt >= from && t.doneAt <= to);
      const hist = k.hist.filter(h => h.at <= end), stNow = hist.length ? hist[hist.length - 1].status : 'Not started';
      const rf = S.reflections.filter(x => x.userId === S.me && x.targetType === 'kr' && x.targetId === k.id && x.date >= from && x.date <= to);
      if (!ts.length && !rf.length && stNow === 'Not started') return;
      out += '- ' + k.title + ' [' + qLabel(k.quarter) + ', ' + stNow + ']: ' + ts.length + ' tasks completed\n';
      ts.slice().sort((a, b) => a.doneAt < b.doneAt ? -1 : 1).forEach(t => { out += '    ' + t.doneAt + '  ' + t.title + (t.note ? ' (' + t.note + ')' : '') + '\n'; });
      rf.forEach(x => { out += '    Reflection ' + x.date + ': ' + x.text + '\n'; });
    });
    S.reflections.filter(x => x.userId === S.me && x.targetType === 'goal' && x.targetId === g.id && x.date >= from && x.date <= to)
      .forEach(x => { out += '  Goal reflection ' + x.date + ': ' + x.text + '\n'; });
  });
  const ch = liveTasks().filter(t => t.owner === S.me && t.done && t.doneAt >= from && t.doneAt <= to);

const weekStart = () => ui.leadWeek || mondayOf(TODAY);
function weekDays(m){
  const d = [0, 1, 2, 3, 4].map(i => addDays(m, i));
  [5, 6].forEach(function(i){
    const ds = addDays(m, i);
    if (S.settings.fullWeek || S.users.some(u => { const e = dayEntry(u.id, ds); return e && e.type === 'special'; })) d.push(ds);
  });
  return d;
}
function personWeek(uid_, days){
  const avail = sum(days, d => effAvail(uid_, d));
  const per = {}, label = {};
  days.forEach(function(d){
    if (effAvail(uid_, d) <= 0) return;
    const p = getPlan(uid_, d);
    p.blocks.forEach(function(b){ const k = b.name.trim().toLowerCase(); label[k] = label[k] || b.name; per[k] = (per[k] || 0) + (+p.hours[b.id] || 0); });
  });
  const planned = sum(Object.keys(per), k => per[k]);
  const od = overdueTasks(uid_);
  return {avail: avail, per: per, label: label, planned: planned, unest: 0,
    over: od, overFlag: od.filter(t => dayDiff(TODAY, t.date) >= S.settings.overdueDays).length};
}
function blockCols(rows){
  const cols = [], seen = {};
  const add = (k, n) => { if (!seen[k]) { seen[k] = 1; cols.push({id: k, name: n}); } };
  S.users.forEach(u => viewOf(u.id).forEach(b => add(b.name.trim().toLowerCase(), b.name)));
  rows.forEach(r => Object.keys(r.w.per).forEach(k => add(k, r.w.label[k])));
  return cols;
}
function ptoStats(u){
  const y = String(parseISO(TODAY).getFullYear()); let taken = 0, planned = 0;
  Object.keys(S.days).forEach(function(k){
    const p = k.split('|');
    if (p[0] === u.id && S.days[k].type === 'pto' && p[1].slice(0, 4) === y) { if (p[1] < TODAY) taken++; else planned++; }
  });
  const allow = u.pto || 0;
  return {allow: allow, taken: taken, planned: planned, left: allow - taken - planned};
}

async function cloudSignUp(f){
  const n = f.querySelector('#au-n').value.trim(), e = f.querySelector('#au-e').value.trim().toLowerCase(), pw = f.querySelector('#au-p').value, c = f.querySelector('#au-c').value.trim();
  if (!n || !e || !pw || !c) { authErr('Fill in all fields.'); return; }
  if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(e)) { authErr('Enter a valid email.'); return; }
  if (pw.length < 8) { authErr('Password needs at least 8 characters.'); return; }
  if (pw !== f.querySelector('#au-p2').value) { authErr('The two passwords do not match.'); return; }
  const btn = f.querySelector('button[type=submit]'); btn.disabled = true;
  try { localStorage.setItem('sterling-join', JSON.stringify({email: e, name: n, code: c})); } catch(x) {}
  let r = await SB.auth.signUp({email: e, password: pw, options: {data: {name: n}}});
  if (r.error && /already/i.test(r.error.message)) r = await SB.auth.signInWithPassword({email: e, password: pw});
  else if (!r.error && r.data && r.data.user && !r.data.session && (r.data.user.identities || []).length === 0) r = await SB.auth.signInWithPassword({email: e, password: pw});
  btn.disabled = false;
  if (r.error) { authErr(/invalid login/i.test(r.error.message) ? 'This email already has an account. Use Sign in.' : r.error.message); return; }
  if (!r.data.session) { ui.authTab = 'in'; ui.authErr = ''; showAuth(); authErr('Check your email and confirm your address, then sign in.'); return; }
  await enterCloud();
}

(function(){
  const cv = document.createElement('canvas').getContext('2d');
  function ink(el, ch){
    const cs = getComputedStyle(el); cv.font = cs.fontStyle + ' ' + cs.fontWeight + ' ' + cs.fontSize + ' ' + cs.fontFamily;
    const m = cv.measureText(ch); return {l: -m.actualBoundingBoxLeft, r: m.width - m.actualBoundingBoxRight};
  }
  function alignSub(w){
    const brand = w.querySelector('.brand'), sub = w.querySelector('.brandsub'); if (!brand || !sub) return;
    const sp = sub.firstElementChild, ep = sub.lastElementChild; if (!sp || !ep) return;
    sub.style.marginLeft = '0px'; sub.style.marginRight = '0px';
    let gNode = null; const tw = document.createTreeWalker(brand, NodeFilter.SHOW_TEXT);
    let n; while ((n = tw.nextNode())) { if (/erling/.test(n.nodeValue)) gNode = n; }
    const sNode = brand.firstChild; if (!gNode || !sNode || sNode.nodeType !== 3) return;
    const rg = document.createRange(), rs = document.createRange();
    const gi = gNode.nodeValue.indexOf('erling') + 5; rg.setStart(gNode, gi); rg.setEnd(gNode, gi + 1);
    rs.setStart(sNode, 0); rs.setEnd(sNode, 1);
    const gR = rg.getBoundingClientRect().right - ink(brand, 'g').r, sL = rs.getBoundingClientRect().left + ink(brand, 'S').l;
    const tL = sp.getBoundingClientRect().left + ink(sub, 'T').l, rR = ep.getBoundingClientRect().right - ink(sub, 'R').r;
    sub.style.marginLeft = (sL - tL) + 'px'; sub.style.marginRight = (rR - gR) + 'px';
  }
  function alignAll(){ document.querySelectorAll('.brandwrap').forEach(alignSub); }
  window.__alignBrand = alignAll;
  window.addEventListener('resize', alignAll);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(alignAll);
  if (document.fonts && document.fonts.addEventListener) document.fonts.addEventListener('loadingdone', alignAll);
  alignAll();
})();
